name: Verify city and battery simulation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python city_cli.py --config examples/city.json --output outputs/ci-city
      - run: python city_export.py outputs/ci-city --output outputs/ci-city/city.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: city-example-data
          path: outputs/ci-city
